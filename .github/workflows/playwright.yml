name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Regenerate ALL visual baselines on this branch (after an intended UI change)
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1-5' # weekdays 06:00 UTC — catches changes in the apps under test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: ${{ matrix.project }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # lets the visual job commit newly generated baselines back to the branch
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui-chromium, ui-firefox, a11y, visual]

    steps:
      - uses: actions/checkout@v4
        with:
          # check out the branch itself (not the PR merge commit) so baselines can be pushed back to it
          ref: ${{ matrix.project == 'visual' && (github.head_ref || github.ref_name) || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project == 'ui-firefox' && 'firefox' || 'chromium' }}

      # Visual baselines must come from the same OS as the comparison (Linux), so CI creates them:
      # missing ones are generated automatically; all are regenerated when requested via workflow_dispatch.
      - name: Generate visual baselines
        if: matrix.project == 'visual'
        run: >
          npx playwright test --project=visual --grep-invert @known-visual-bug --reporter=list
          --update-snapshots=${{ inputs.update_visual_baselines && 'all' || 'missing' }}

      - name: Commit new or updated baselines
        if: matrix.project == 'visual'
        run: |
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update visual baselines (generated on Linux CI)"
            git push
          fi

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 1

  report:
    name: Build reports
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Merge Playwright HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o playwright-report/allure

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: playwright-report/
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy:
    name: Publish reports to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
